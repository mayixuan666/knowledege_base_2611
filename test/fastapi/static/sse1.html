<!DOCTYPE html>
<html>
    <head>
        <title>SSE1</title>
    </head>
    <body>
        <h3>场景1：基础的sse测试</h3>
        <div id="result"></div>
        <button onclick="submitSSE()">点我</button>

        <script>
            function submitSSE(){
                resultDom = document.getElementById('result');
                eventSource = new EventSource('http://192.168.44.1:8001/simple_stream');
                eventSource.onmessage = function (event){
                    if(event.data == "[END]"){
                        eventSource.close();
                        return;
                    }
                    resultDom.innerHTML += event.data + '<br/>';
                }

            }
        </script>
    </body>


</html>
