<!DOCTYPE html>
<html>
<head>
    <title>场景2：按会话ID推数据</title>
</head>
<body>
    <h3>场景2：按会话ID推数据</h3>
    <input type="text" id="sessionIdInput" placeholder="请输入session_id" value="">
    <button onclick="connectSSE()">提交</button>
    <div id="result"></div>

    <script>
        function connectSSE() {
            // URL带session_id参数
            const sessionId = document.getElementById("sessionIdInput").value;
            const eventSource = new EventSource(`http://192.168.44.1:8001/stream/${sessionId}`);
            const resultDom = document.getElementById("result");

            // 监听SSE消息（实时接收）
            eventSource.onmessage = function(event) {
                if (event.data === "[END]") {
                    eventSource.close();
                    return;
                }
                resultDom.innerHTML += event.data + "<br>";
            };
        }
    </script>
</body>
</html>
